<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Catalyst — Gov Contracts</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=DM+Sans:wght@400;500&family=DM+Mono:wght@400&display=swap');
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#08090d;color:#e0eaf4;font-family:'DM Sans',sans-serif;min-height:100vh;}
    .card{background:#0d1117;border:1px solid #1a2030;transition:border-color .15s;margin-bottom:3px;border-radius:1px;cursor:pointer;}
    .card:hover{border-color:#253040;}
    .fade{animation:fi .18s ease;}
    @keyframes fi{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
    .spin{animation:sp 1s linear infinite;}
    @keyframes sp{to{transform:rotate(360deg)}}
    .btn{background:transparent;border:1px solid #1a2030;color:#8090a0;padding:5px 12px;font-family:'DM Mono',monospace;font-size:10px;cursor:pointer;letter-spacing:.07em;border-radius:1px;}
    .btn:hover{border-color:#3a5060;color:#c0d0e0;}
    .btn.active{border-color:#e8a020;color:#e8a020;}
    input{background:#0d1117;border:1px solid #1a2030;color:#e0eaf4;padding:6px 10px;font-family:'DM Mono',monospace;font-size:11px;border-radius:1px;outline:none;width:100%;}
    input:focus{border-color:#3a5060;}
    ::-webkit-scrollbar{height:3px;width:3px;}
    ::-webkit-scrollbar-track{background:#08090d;}
    ::-webkit-scrollbar-thumb{background:#1a2030;}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

const API = "https://api.usaspending.gov/api/v2";
const STORAGE_KEY = "catalyst_contracts_v1";
const WATCHLIST_KEY = "catalyst_watchlist_v1";

const DEFAULT_WATCHLIST = [
  { name:"Palantir",  color:"#a374e8" },
  { name:"NVIDIA",    color:"#76b900" },
  { name:"NextEra",   color:"#4a90e2" },
  { name:"Amazon",    color:"#ff9900" },
  { name:"RTX",       color:"#c87020" },
  { name:"Raytheon",  color:"#c87020" },
];

const AGENCIES = [
  "Department of Defense",
  "Department of Energy",
  "Department of Homeland Security",
  "National Aeronautics and Space Administration",
  "General Services Administration",
  "Department of Transportation",
  "Department of Health and Human Services",
  "Department of Veterans Affairs",
  "Department of Justice",
  "Department of the Interior",
  "Department of Agriculture",
  "Department of Commerce",
  "Department of State",
  "Department of the Treasury",
  "Department of Labor",
  "Environmental Protection Agency",
  "Office of Personnel Management",
  "Social Security Administration",
];

function loadStorage(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}
function saveStorage(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

function fmt$(n) {
  if (!n||n===0) return "Undisclosed";
  if (n>=1e9) return `$${(n/1e9).toFixed(2)}B`;
  if (n>=1e6) return `$${(n/1e6).toFixed(1)}M`;
  if (n>=1e3) return `$${(n/1e3).toFixed(0)}K`;
  return `$${n.toFixed(0)}`;
}

function fmtDate(s) {
  if (!s) return "Not recorded";
  try { return new Date(s).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); }
  catch { return s; }
}

function timeAgo(s) {
  if (!s) return "";
  const d = Math.floor((Date.now()-new Date(s))/86400000);
  if (d===0) return "Today";
  if (d===1) return "Yesterday";
  if (d<7)   return `${d}d ago`;
  if (d<30)  return `${Math.floor(d/7)}w ago`;
  return `${Math.floor(d/30)}mo ago`;
}

function contractKey(c) {
  return c["Award ID"] || c["generated_unique_award_id"] || `${c["Recipient Name"]}-${c["Award Amount"]}`;
}

function watchlistMatch(recipient="", watchlist=[]) {
  const n = recipient.toUpperCase();
  return watchlist.find(w => n.includes(w.name.toUpperCase())) || null;
}

async function queryAgency(agencyName) {
  const today = new Date().toISOString().slice(0,10);
  const body = {
    filters: {
      award_type_codes: ["A","B","C","D"],
      time_period: [{ start_date:"2022-01-01", end_date: today }],
      award_amounts: [{ lower_bound: 100000 }],
      agencies: [{ type:"awarding", tier:"toptier", name:agencyName }],
    },
    fields: ["Award ID","generated_unique_award_id","Recipient Name","Action Date","Award Amount",
             "Awarding Agency Name","Awarding Sub Agency Name","Description",
             "Period of Performance Start Date","Period of Performance Current End Date"],
    page:1, limit:15, sort:"Award Amount", order:"desc", subawards:false,
  };
  try {
    const r = await fetch(`${API}/search/spending_by_award/`,{
      method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body),
    });
    if (!r.ok) return [];
    const d = await r.json();
    return (d.results||[])
      .filter(c => {
        const desc = (c["Description"]||"").trim();
        return !desc.includes("IGF::OT::IGF") && !desc.includes("IGF::CT::IGF");
      })
      .map(c => ({
        ...c,
        "Awarding Agency Name": c["Awarding Agency Name"] || agencyName,
        "_key": contractKey(c),
      }));
  } catch { return []; }
}

// ── WATCHLIST MANAGER ───────────────────────────────────────────────────────
function WatchlistManager({ watchlist, onSave, onClose }) {
  const [items, setItems] = useState(watchlist);
  const [newName, setNewName] = useState("");

  const add = () => {
    const n = newName.trim();
    if (!n || items.find(i=>i.name.toLowerCase()===n.toLowerCase())) return;
    const colors = ["#a374e8","#76b900","#4a90e2","#ff9900","#c87020","#ff6b9d","#5ac8fa","#00e5a0"];
    setItems(prev => [...prev, { name:n, color:colors[prev.length % colors.length] }]);
    setNewName("");
  };

  const remove = name => setItems(prev => prev.filter(i=>i.name!==name));

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.8)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{background:"#0d1117",border:"1px solid #1a2030",borderRadius:2,padding:24,width:"100%",maxWidth:400}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
          <span style={{fontFamily:"Oswald",fontSize:14,letterSpacing:".15em",color:"#e0eaf4"}}>WATCHLIST</span>
          <button className="btn" onClick={onClose}>CLOSE</button>
        </div>

        <div style={{marginBottom:16}}>
          {items.map(item=>(
            <div key={item.name} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid #0f1520"}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <div style={{width:8,height:8,borderRadius:"50%",background:item.color}}/>
                <span style={{fontFamily:"'DM Mono'",fontSize:12,color:"#c0d0e0"}}>{item.name}</span>
              </div>
              <button className="btn" onClick={()=>remove(item.name)} style={{padding:"2px 8px",fontSize:9,color:"#ff3057",borderColor:"#ff305730"}}>✕</button>
            </div>
          ))}
        </div>

        <div style={{display:"flex",gap:8,marginBottom:16}}>
          <input
            value={newName}
            onChange={e=>setNewName(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&add()}
            placeholder="Add company name…"
          />
          <button className="btn" onClick={add} style={{whiteSpace:"nowrap",borderColor:"#3a5060",color:"#c0d0e0"}}>ADD</button>
        </div>

        <button className="btn" onClick={()=>onSave(items)}
          style={{width:"100%",padding:"8px",borderColor:"#e8a020",color:"#e8a020",fontSize:11}}>
          SAVE WATCHLIST
        </button>
      </div>
    </div>
  );
}

// ── CONTRACT CARD ───────────────────────────────────────────────────────────
function ContractCard({ c, isNew, watchlist }) {
  const [open, setOpen] = useState(false);
  const amount    = c["Award Amount"]||0;
  const agency    = c["Awarding Agency Name"]||"";
  const subAgency = c["Awarding Sub Agency Name"]||"";
  const recipient = c["Recipient Name"]||"Unknown";
  const desc      = c["Description"]||"";
  const date      = c["Action Date"]||c["Period of Performance Start Date"]||"";
  const endDate   = c["Period of Performance Current End Date"]||"";
  const uniqueId  = c["generated_unique_award_id"]||c["Award ID"]||"";
  const match     = watchlistMatch(recipient, watchlist);
  const matchColor = match?.color || "#e8a020";
  const isHuge    = amount >= 1e9;
  const accentColor = isNew ? "#e8a020" : match ? matchColor : isHuge ? "#00e5a0" : "#1a2030";

  return (
    <div className="card fade" onClick={()=>setOpen(o=>!o)} style={{borderLeft:`2px solid ${accentColor}`}}>
      <div style={{padding:"11px 14px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12}}>
          <div style={{flex:1,minWidth:0}}>
            {/* Badges */}
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:match||isNew?6:0}}>
              {isNew && (
                <span style={{fontFamily:"'DM Mono'",fontSize:9,color:"#e8a020",background:"#e8a02015",border:"1px solid #e8a02040",padding:"2px 7px",borderRadius:2,letterSpacing:".08em"}}>
                  ● NEW
                </span>
              )}
              {match && (
                <span style={{fontFamily:"'DM Mono'",fontSize:9,color:matchColor,background:`${matchColor}15`,border:`1px solid ${matchColor}40`,padding:"2px 7px",borderRadius:2,letterSpacing:".08em"}}>
                  {match.name.toUpperCase()}
                </span>
              )}
            </div>
            <div style={{fontSize:13,fontWeight:500,color:"#dce8f4",lineHeight:1.4,marginBottom:3}}>{recipient}</div>
            <div style={{fontFamily:"'DM Mono'",fontSize:10,color:"#4a6070"}}>{agency}</div>
            {date && <div style={{fontFamily:"'DM Mono'",fontSize:10,color:"#3a5060",marginTop:2}}>{timeAgo(date)}</div>}
          </div>
          <div style={{textAlign:"right",flexShrink:0}}>
            <div style={{fontFamily:"'DM Mono'",fontSize:13,color:isHuge?"#00e5a0":"#8090a0",fontWeight:500}}>{fmt$(amount)}</div>
            <div style={{fontSize:10,color:"#283848",marginTop:4,transform:open?"rotate(180deg)":"none",transition:"transform .15s"}}>▾</div>
          </div>
        </div>

        {open && (
          <div className="fade" onClick={e=>e.stopPropagation()} style={{marginTop:12,paddingTop:12,borderTop:"1px solid #0f1520"}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
              {[
                ["Recipient",      recipient],
                ["Contract Value", fmt$(amount)],
                ["Agency",         agency],
                ["Sub-Agency",     subAgency||"—"],
                ["Award Date",     fmtDate(date)],
                ["End Date",       fmtDate(endDate)],
              ].map(([label,val])=>(
                <div key={label}>
                  <div style={{fontFamily:"'DM Mono'",fontSize:9,color:"#3a5060",letterSpacing:".1em",textTransform:"uppercase",marginBottom:3}}>{label}</div>
                  <div style={{fontSize:12,color:"#a0b8c8",lineHeight:1.4,wordBreak:"break-word"}}>{val}</div>
                </div>
              ))}
            </div>
            {desc && (
              <div style={{marginBottom:12}}>
                <div style={{fontFamily:"'DM Mono'",fontSize:9,color:"#3a5060",letterSpacing:".1em",textTransform:"uppercase",marginBottom:4}}>Description</div>
                <div style={{fontSize:12,color:"#8090a0",lineHeight:1.65}}>{desc}</div>
              </div>
            )}
            {uniqueId && (
              <a href={`https://www.usaspending.gov/award/${encodeURIComponent(uniqueId)}`}
                target="_blank" rel="noopener noreferrer"
                style={{fontFamily:"'DM Mono'",fontSize:10,color:"#4a90e2",border:"1px solid #1a3060",padding:"4px 10px",borderRadius:2,display:"inline-block"}}>
                View on USASpending →
              </a>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

// ── MAIN APP ────────────────────────────────────────────────────────────────
function App() {
  const [watchlist, setWatchlist]     = useState(()=>loadStorage(WATCHLIST_KEY, DEFAULT_WATCHLIST));
  const [showWL, setShowWL]           = useState(false);
  const [contracts, setContracts]     = useState([]);
  const [newKeys, setNewKeys]         = useState(new Set());
  const [loading, setLoading]         = useState(true);
  const [agencyFilter, setAgencyFilter] = useState("ALL");
  const [showOnlyNew, setShowOnlyNew] = useState(false);
  const [showOnlyWL, setShowOnlyWL]   = useState(false);
  const [lastChecked, setLastChecked] = useState(null);
  const [lastUpdated, setLastUpdated] = useState(null);

  const load = useCallback(async (wl=watchlist) => {
    setLoading(true); setAgencyFilter("ALL");

    // Load what we saw last time
    const prev = loadStorage(STORAGE_KEY, { keys:[], time:null });

    const results = await Promise.all(AGENCIES.map(a=>queryAgency(a)));
    const all = results.flat();
    all.sort((a,b)=>(b["Award Amount"]||0)-(a["Award Amount"]||0));

    // Find new contracts since last visit
    const prevKeys = new Set(prev.keys||[]);
    const currentKeys = all.map(c=>c["_key"]);
    const fresh = new Set(currentKeys.filter(k => !prevKeys.has(k)));

    // Save current state
    saveStorage(STORAGE_KEY, { keys:currentKeys, time:Date.now() });

    setContracts(all);
    setNewKeys(fresh);
    setLastChecked(prev.time ? new Date(prev.time) : null);
    setLastUpdated(new Date());
    setLoading(false);
  }, [watchlist]);

  useEffect(()=>{ load(); },[]);

  const saveWatchlist = wl => {
    setWatchlist(wl);
    saveStorage(WATCHLIST_KEY, wl);
    setShowWL(false);
  };

  // Build agency list
  const agencyTotals = {};
  contracts.forEach(c=>{
    const a = c["Awarding Agency Name"]||"Other";
    agencyTotals[a] = (agencyTotals[a]||0)+(c["Award Amount"]||0);
  });
  const agencies = Object.entries(agencyTotals).sort((a,b)=>b[1]-a[1]).map(([n])=>n);

  // Filter
  let visible = contracts;
  if (agencyFilter!=="ALL") visible = visible.filter(c=>c["Awarding Agency Name"]===agencyFilter);
  if (showOnlyWL) visible = visible.filter(c=>watchlistMatch(c["Recipient Name"]||"",watchlist));
  if (showOnlyNew) visible = visible.filter(c=>newKeys.has(c["_key"]));

  const wlHits    = contracts.filter(c=>watchlistMatch(c["Recipient Name"]||"",watchlist)).length;
  const newWLHits = contracts.filter(c=>newKeys.has(c["_key"])&&watchlistMatch(c["Recipient Name"]||"",watchlist)).length;
  const totalNew  = newKeys.size;

  return (
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column"}}>
      {showWL && <WatchlistManager watchlist={watchlist} onSave={saveWatchlist} onClose={()=>setShowWL(false)}/>}

      {/* HEADER */}
      <header style={{borderBottom:"1px solid #0f1520",padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,position:"sticky",top:0,background:"#08090d",zIndex:100}}>
        <div style={{display:"flex",alignItems:"baseline",gap:12}}>
          <span style={{fontFamily:"Oswald",fontSize:8,letterSpacing:".5em",color:"#c87020",textTransform:"uppercase"}}>Catalyst</span>
          <span style={{fontFamily:"Oswald",fontSize:20,fontWeight:700,color:"#e0eaf4",letterSpacing:".03em"}}>GOV CONTRACTS</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          {!loading && totalNew>0 && (
            <span style={{fontFamily:"'DM Mono'",fontSize:10,color:"#e8a020",background:"#e8a02015",border:"1px solid #e8a02040",padding:"3px 8px",borderRadius:2}}>
              {totalNew} new
            </span>
          )}
          <button className="btn" onClick={()=>setShowWL(true)}>WATCHLIST</button>
          <button className="btn" onClick={()=>load()} disabled={loading}>{loading?"…":"↻"}</button>
        </div>
      </header>

      {/* FILTERS ROW */}
      {!loading && (
        <div style={{borderBottom:"1px solid #0f1520",padding:"8px 20px",display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
          {/* Watchlist / New toggles */}
          <button className={`btn${showOnlyWL?" active":""}`} onClick={()=>setShowOnlyWL(v=>!v)}>
            ● WATCHLIST {wlHits>0&&`(${wlHits})`}
          </button>
          {totalNew>0 && (
            <button className={`btn${showOnlyNew?" active":""}`} onClick={()=>setShowOnlyNew(v=>!v)}
              style={{borderColor:showOnlyNew?"#e8a020":"#1a2030",color:showOnlyNew?"#e8a020":"#8090a0"}}>
              ● NEW {newWLHits>0&&`(${newWLHits} watchlist)`}
            </button>
          )}
          <div style={{width:1,height:14,background:"#1a2030",margin:"0 2px"}}/>
          {/* Agency pills */}
          <button className={`btn${agencyFilter==="ALL"?" active":""}`} onClick={()=>setAgencyFilter("ALL")}>
            ALL
          </button>
          {agencies.map(a=>{
            const hasNew = contracts.filter(c=>c["Awarding Agency Name"]===a&&newKeys.has(c["_key"])).length>0;
            const hasWL  = contracts.filter(c=>c["Awarding Agency Name"]===a&&watchlistMatch(c["Recipient Name"]||"",watchlist)).length>0;
            return (
              <button key={a} className={`btn${agencyFilter===a?" active":""}`} onClick={()=>setAgencyFilter(a)}
                style={{position:"relative"}}>
                {a.replace("Department of ","").replace("National Aeronautics and Space Administration","NASA")}
                {(hasNew||hasWL)&&<span style={{marginLeft:4,color:"#e8a020"}}>●</span>}
              </button>
            );
          })}
        </div>
      )}

      {/* STATS */}
      {!loading && (
        <div style={{padding:"8px 20px",display:"flex",gap:20,borderBottom:"1px solid #0f1520",flexShrink:0,flexWrap:"wrap"}}>
          <div>
            <div style={{fontFamily:"'DM Mono'",fontSize:9,color:"#3a5060",letterSpacing:".1em",textTransform:"uppercase",marginBottom:2}}>Showing</div>
            <div style={{fontFamily:"'DM Mono'",fontSize:12,color:"#c0d0e0"}}>{visible.length} contracts</div>
          </div>
          <div>
            <div style={{fontFamily:"'DM Mono'",fontSize:9,color:"#3a5060",letterSpacing:".1em",textTransform:"uppercase",marginBottom:2}}>Total Value</div>
            <div style={{fontFamily:"'DM Mono'",fontSize:12,color:"#c0d0e0"}}>{fmt$(visible.reduce((s,c)=>s+(c["Award Amount"]||0),0))}</div>
          </div>
          {lastChecked && (
            <div>
              <div style={{fontFamily:"'DM Mono'",fontSize:9,color:"#3a5060",letterSpacing:".1em",textTransform:"uppercase",marginBottom:2}}>Last Checked</div>
              <div style={{fontFamily:"'DM Mono'",fontSize:12,color:"#c0d0e0"}}>{lastChecked.toLocaleDateString("en-US",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}</div>
            </div>
          )}
        </div>
      )}

      {/* CONTENT */}
      <main style={{padding:"12px 20px 60px",flex:1,maxWidth:900}}>
        {loading && (
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"120px 0",gap:14}}>
            <div className="spin" style={{width:16,height:16,border:"2px solid #0f1520",borderTopColor:"#c87020",borderRadius:"50%"}}/>
            <span style={{fontFamily:"'DM Mono'",fontSize:10,color:"#3a5060",letterSpacing:".1em"}}>FETCHING CONTRACTS…</span>
          </div>
        )}
        {!loading && visible.length===0 && (
          <div style={{fontFamily:"'DM Mono'",fontSize:10,color:"#2a3a48",padding:"60px 0",textAlign:"center"}}>
            NO CONTRACTS MATCH
          </div>
        )}
        {!loading && visible.map((c,i)=>(
          <ContractCard key={c["_key"]||i} c={c} isNew={newKeys.has(c["_key"])} watchlist={watchlist}/>
        ))}
      </main>

      <div style={{padding:"0 20px 16px",fontFamily:"'DM Mono'",fontSize:9,color:"#1a2a38",letterSpacing:".08em",textTransform:"uppercase"}}>
        Source: USASpending.gov · {contracts.length} contracts loaded · Data may lag 30–90 days
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
