<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Catalyst — Gov Contracts</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=DM+Sans:wght@400;500&family=DM+Mono:wght@400&display=swap');
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#08090d;color:#e0eaf4;font-family:'DM Sans',sans-serif;min-height:100vh;}
    .card{background:#0d1117;border:1px solid #1a2030;transition:border-color .15s;margin-bottom:3px;border-radius:1px;cursor:pointer;}
    .card:hover{border-color:#253040;}
    .fade{animation:fi .18s ease;}
    @keyframes fi{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
    .spin{animation:sp 1s linear infinite;}
    @keyframes sp{to{transform:rotate(360deg)}}
    .agency-pill{display:inline-flex;align-items:center;padding:5px 12px;border-radius:2px;font-size:10px;font-family:'DM Mono',monospace;letter-spacing:.06em;cursor:pointer;border:1px solid #1a2030;background:transparent;color:#4a6070;transition:all .15s;white-space:nowrap;}
    .agency-pill.active{background:#0d1117;color:#e0eaf4;border-color:#3a5060;}
    .agency-pill:hover{border-color:#3a5060;color:#a0b8c8;}
    ::-webkit-scrollbar{height:3px;width:3px;}
    ::-webkit-scrollbar-track{background:#08090d;}
    ::-webkit-scrollbar-thumb{background:#1a2030;}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// Watchlist — companies to flag in contract feed
const WATCHLIST = ["Palantir","NVIDIA","NextEra","Amazon","RTX","Raytheon"];
const WATCHLIST_COLORS = {
  "Palantir":"#a374e8","NVIDIA":"#76b900","NextEra":"#4a90e2",
  "Amazon":"#ff9900","RTX":"#c87020","Raytheon":"#c87020",
};

function watchlistMatch(recipientName="") {
  const n = recipientName.toUpperCase();
  return WATCHLIST.find(w => n.includes(w.toUpperCase())) || null;
}

const API = "https://api.usaspending.gov/api/v2";

function fmt$(n) {
  if (!n||n===0) return "Undisclosed";
  if (n>=1e9) return `$${(n/1e9).toFixed(2)}B`;
  if (n>=1e6) return `$${(n/1e6).toFixed(1)}M`;
  if (n>=1e3) return `$${(n/1e3).toFixed(0)}K`;
  return `$${n.toFixed(0)}`;
}

function fmtDate(s) {
  if (!s) return "—";
  try { return new Date(s).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); }
  catch { return s; }
}

function timeAgo(s) {
  if (!s) return "";
  const d = Math.floor((Date.now()-new Date(s))/86400000);
  if (d===0) return "Today";
  if (d===1) return "Yesterday";
  if (d<7)   return `${d}d ago`;
  if (d<30)  return `${Math.floor(d/7)}w ago`;
  if (d<365) return `${Math.floor(d/30)}mo ago`;
  return `${Math.floor(d/365)}y ago`;
}


const AGENCIES = [
  "Department of Defense",
  "Department of Energy",
  "Department of Homeland Security",
  "National Aeronautics and Space Administration",
  "General Services Administration",
  "Department of Transportation",
  "Department of Health and Human Services",
  "Department of Veterans Affairs",
  "Department of Justice",
  "Department of the Interior",
  "Department of Agriculture",
  "Department of Commerce",
  "Department of State",
  "Department of the Treasury",
  "Department of Labor",
  "Department of Education",
  "Department of Housing and Urban Development",
  "Environmental Protection Agency",
  "Social Security Administration",
  "Office of Personnel Management",
];

async function queryAgency(agencyName, sortField, sortOrder, limit) {
  const today = new Date().toISOString().slice(0,10);
  const body = {
    filters: {
      award_type_codes: ["A","B","C","D"],
      time_period: [{ start_date:"2022-01-01", end_date: today }],
      award_amounts: [{ lower_bound: 100000 }],
      agencies: [{ type:"awarding", tier:"toptier", name:agencyName }],
    },
    fields: ["Award ID","generated_unique_award_id","Recipient Name","Action Date","Award Amount","Awarding Agency Name","Awarding Sub Agency Name","Description","Period of Performance Start Date","Period of Performance Current End Date","Contract Award Type"],
    page: 1,
    limit,
    sort: sortField,
    order: sortOrder,
    subawards: false,
  };
  try {
    const r = await fetch(`${API}/search/spending_by_award/`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(body),
    });
    if (!r.ok) return [];
    const d = await r.json();
    return (d.results||[])
      .filter(c => {
        const desc = (c["Description"]||"").trim();
        return !desc.includes("IGF::OT::IGF") && !desc.includes("IGF::CT::IGF");
      })
      .map(c => ({
        ...c,
        "Awarding Agency Name": c["Awarding Agency Name"] || agencyName,
      }));
  } catch { return []; }
}

async function fetchForAgency(agencyName) {
  // Fetch top by value AND most recent by date, then merge unique
  const [byValue, byDate] = await Promise.all([
    queryAgency(agencyName, "Award Amount", "desc", 10),
    queryAgency(agencyName, "Action Date",  "desc", 10),
  ]);
  const seen = new Set();
  const merged = [];
  for (const c of [...byValue, ...byDate]) {
    const key = c["Award ID"] || c["generated_unique_award_id"] || JSON.stringify(c);
    if (!seen.has(key)) { seen.add(key); merged.push(c); }
  }
  return merged;
}

async function fetchAllContracts() {
  const results = await Promise.all(AGENCIES.map(a => fetchForAgency(a)));
  const all = results.flat();
  all.sort((a,b)=>(b["Award Amount"]||0)-(a["Award Amount"]||0));
  return all;
}

function ContractCard({c}) {
  const [open, setOpen] = useState(false);
  const amount    = c["Award Amount"]||0;
  const agency    = c["Awarding Agency Name"]||"Unknown Agency";
  const subAgency = c["Awarding Sub Agency Name"]||"";
  const recipient = c["Recipient Name"]||"Unknown";
  const desc      = c["Description"]||"";
  const date      = c["Action Date"] || c["Period of Performance Start Date"] || "";
  const endDate   = c["Period of Performance Current End Date"]||"";
  const awardId   = c["Award ID"]||"";
  const uniqueId  = c["generated_unique_award_id"]||awardId||"";
  const match     = watchlistMatch(recipient);
  const matchColor = match ? (WATCHLIST_COLORS[match]||"#e8a020") : null;
  const isHuge    = amount >= 1e9;
  const isLarge   = amount >= 1e8;
  const accentColor = isHuge?"#00e5a0":isLarge?"#60a5fa":"#1a2030";

  return (
    <div className="card fade" onClick={handleOpen}
      style={{borderLeft:`2px solid ${match?matchColor:accentColor}`}}>
      <div style={{padding:"11px 14px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12}}>
          <div style={{flex:1,minWidth:0}}>
            {/* Watchlist flag */}
            {match && (
              <div style={{display:"inline-flex",alignItems:"center",gap:5,marginBottom:5,padding:"2px 7px",background:`${matchColor}15`,border:`1px solid ${matchColor}40`,borderRadius:2}}>
                <div style={{width:5,height:5,borderRadius:"50%",background:matchColor}}/>
                <span style={{fontFamily:"'DM Mono'",fontSize:9,color:matchColor,letterSpacing:".08em",textTransform:"uppercase"}}>{match}</span>
              </div>
            )}
            <div style={{fontSize:13,fontWeight:500,color:"#dce8f4",lineHeight:1.4,marginBottom:3}}>{recipient}</div>
            <div style={{fontFamily:"'DM Mono'",fontSize:10,color:"#4a6070",marginBottom:2}}>{agency}</div>
            {subAgency && subAgency!==agency && (
              <div style={{fontFamily:"'DM Mono'",fontSize:9,color:"#2a3a48"}}>{subAgency}</div>
            )}
            <div style={{fontFamily:"'DM Mono'",fontSize:10,color:"#3a5060",marginTop:3}}>{timeAgo(date)}</div>
          </div>
          <div style={{textAlign:"right",flexShrink:0}}>
            <div style={{fontFamily:"'DM Mono'",fontSize:14,color:isHuge?"#00e5a0":isLarge?"#60a5fa":"#8090a0",fontWeight:500}}>
              {fmt$(amount)}
            </div>
            <div style={{fontSize:10,color:"#283848",marginTop:4,transform:open?"rotate(180deg)":"none",transition:"transform .15s"}}>▾</div>
          </div>
        </div>

        {open && (
          <div className="fade" onClick={e=>e.stopPropagation()} style={{marginTop:12,paddingTop:12,borderTop:"1px solid #0f1520"}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
              {[
                ["Recipient",     recipient],
                ["Contract Value",fmt$(amount)],
                ["Agency",        agency],
                ["Sub-Agency",    subAgency||"—"],
                ["Award Date",    fmtDate(date)],
                ["End Date",      fmtDate(endDate)],
              ].map(([label,val])=>(
                <div key={label}>
                  <div style={{fontFamily:"'DM Mono'",fontSize:9,color:"#3a5060",letterSpacing:".1em",textTransform:"uppercase",marginBottom:3}}>{label}</div>
                  <div style={{fontSize:12,color:"#a0b8c8",lineHeight:1.4,wordBreak:"break-word"}}>{val}</div>
                </div>
              ))}
            </div>

            {desc && (
              <div style={{marginBottom:12}}>
                <div style={{fontFamily:"'DM Mono'",fontSize:9,color:"#3a5060",letterSpacing:".1em",textTransform:"uppercase",marginBottom:4}}>Description</div>
                <div style={{fontSize:12,color:"#8090a0",lineHeight:1.65}}>{desc}</div>
              </div>
            )}

            {isHuge && (
              <div style={{padding:"8px 10px",background:"#06080d",border:"1px solid #00e5a020",borderRadius:2,marginBottom:10,display:"flex",alignItems:"center",gap:8}}>
                <span style={{color:"#00e5a0",fontFamily:"'DM Mono'",fontSize:10}}>▲ MAJOR</span>
                <span style={{fontSize:12,color:"#506070"}}>Award exceeds $1B — significant revenue catalyst</span>
              </div>
            )}

            {match && (
              <div style={{padding:"8px 10px",background:`${matchColor}08`,border:`1px solid ${matchColor}25`,borderRadius:2,marginBottom:10,display:"flex",alignItems:"center",gap:8}}>
                <div style={{width:6,height:6,borderRadius:"50%",background:matchColor,flexShrink:0}}/>
                <span style={{fontSize:12,color:"#506070"}}><span style={{color:matchColor}}>{match}</span> is in your watchlist</span>
              </div>
            )}

            {awardId && (
              <a href={`https://www.usaspending.gov/award/${encodeURIComponent(uniqueId)}`} target="_blank" rel="noopener noreferrer"
                style={{fontFamily:"'DM Mono'",fontSize:10,color:"#4a90e2",border:"1px solid #1a3060",padding:"4px 10px",borderRadius:2,display:"inline-block",marginRight:8}}>
                View Contract →
              </a>
            )}
            <a href={`https://www.fpds.gov/ezsearch/search.do?q=${encodeURIComponent(recipient)}&SUBMIT=Search`} target="_blank" rel="noopener noreferrer"
              style={{fontFamily:"'DM Mono'",fontSize:10,color:"#4a90e2",border:"1px solid #1a3060",padding:"4px 10px",borderRadius:2,display:"inline-block"}}>
              Search FPDS →
            </a>

          </div>
        )}
      </div>
    </div>
  );
}

function App() {
  const [contracts, setContracts]     = useState([]);
  const [loading, setLoading]         = useState(true);
  const [error, setError]             = useState(null);
  const [agencyFilter, setAgencyFilter] = useState("ALL");
  const [lastUpdated, setLastUpdated] = useState(null);

  const load = useCallback(async()=>{
    setLoading(true); setError(null); setAgencyFilter("ALL");
    try {
      const results = await fetchAllContracts();
      // Sort by amount descending
      results.sort((a,b)=>(b["Award Amount"]||0)-(a["Award Amount"]||0));
      setContracts(results);
      setLastUpdated(new Date());
    } catch(e) { setError(e.message); }
    setLoading(false);
  },[]);

  useEffect(()=>{ load(); },[load]);

  // Build agency list sorted by total contract value
  const agencyTotals = {};
  contracts.forEach(c=>{
    const a = c["Awarding Agency Name"]||"Unknown";
    agencyTotals[a] = (agencyTotals[a]||0)+(c["Award Amount"]||0);
  });
  const agencies = Object.entries(agencyTotals)
    .sort((a,b)=>b[1]-a[1])
    .map(([name])=>name);

  const visible = agencyFilter==="ALL"
    ? contracts
    : contracts.filter(c=>(c["Awarding Agency Name"]||"Unknown")===agencyFilter);

  const watchlistHits = visible.filter(c=>watchlistMatch(c["Recipient Name"]||"")).length;
  const totalValue    = visible.reduce((s,c)=>s+(c["Award Amount"]||0),0);

  return (
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column"}}>
      {/* HEADER */}
      <header style={{borderBottom:"1px solid #0f1520",padding:"16px 24px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,position:"sticky",top:0,background:"#08090d",zIndex:100}}>
        <div style={{display:"flex",alignItems:"baseline",gap:12}}>
          <span style={{fontFamily:"Oswald",fontSize:8,letterSpacing:".5em",color:"#c87020",textTransform:"uppercase"}}>Catalyst</span>
          <span style={{fontFamily:"Oswald",fontSize:20,fontWeight:700,color:"#e0eaf4",letterSpacing:".03em"}}>GOV CONTRACTS</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          {!loading && watchlistHits>0 && (
            <div style={{display:"flex",alignItems:"center",gap:6,padding:"3px 10px",background:"#e8a02015",border:"1px solid #e8a02040",borderRadius:2}}>
              <div style={{width:5,height:5,borderRadius:"50%",background:"#e8a020"}}/>
              <span style={{fontFamily:"'DM Mono'",fontSize:10,color:"#e8a020"}}>{watchlistHits} watchlist</span>
            </div>
          )}
          {lastUpdated&&<span style={{fontFamily:"'DM Mono'",fontSize:10,color:"#2a3a48"}}>{lastUpdated.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</span>}
          <button onClick={load} disabled={loading}
            style={{background:"transparent",border:"1px solid #1a2030",color:loading?"#2a3a48":"#8090a0",padding:"5px 12px",fontFamily:"'DM Mono'",fontSize:10,cursor:loading?"not-allowed":"pointer",letterSpacing:".07em",borderRadius:1}}>
            {loading?"LOADING":"↻ REFRESH"}
          </button>
        </div>
      </header>

      {/* AGENCY FILTERS */}
      {!loading && agencies.length>0 && (
        <div style={{borderBottom:"1px solid #0f1520",padding:"10px 24px",display:"flex",gap:6,overflowX:"auto",flexShrink:0}}>
          <button className={`agency-pill${agencyFilter==="ALL"?" active":""}`} onClick={()=>setAgencyFilter("ALL")}>
            All Agencies
            <span style={{marginLeft:6,color:"#3a5060"}}>{contracts.length}</span>
          </button>
          {agencies.map(a=>{
            const hits = contracts.filter(c=>(c["Awarding Agency Name"]||"Unknown")===a&&watchlistMatch(c["Recipient Name"]||"")).length;
            return (
              <button key={a} className={`agency-pill${agencyFilter===a?" active":""}`} onClick={()=>setAgencyFilter(a)}>
                {a.replace("Department of","Dept. of").replace("Department of Defense","DoD")}
                {hits>0 && <span style={{marginLeft:5,width:6,height:6,borderRadius:"50%",background:"#e8a020",display:"inline-block"}}/>}
              </button>
            );
          })}
        </div>
      )}

      {/* STATS */}
      {!loading && !error && (
        <div style={{padding:"10px 24px",display:"flex",gap:20,borderBottom:"1px solid #0f1520",flexShrink:0}}>
          <div>
            <div style={{fontFamily:"'DM Mono'",fontSize:9,color:"#3a5060",letterSpacing:".1em",textTransform:"uppercase",marginBottom:2}}>Total Value</div>
            <div style={{fontFamily:"'DM Mono'",fontSize:13,color:"#c0d0e0"}}>{fmt$(totalValue)}</div>
          </div>
          <div>
            <div style={{fontFamily:"'DM Mono'",fontSize:9,color:"#3a5060",letterSpacing:".1em",textTransform:"uppercase",marginBottom:2}}>Contracts</div>
            <div style={{fontFamily:"'DM Mono'",fontSize:13,color:"#c0d0e0"}}>{visible.length}</div>
          </div>
          {agencyFilter!=="ALL" && (
            <div>
              <div style={{fontFamily:"'DM Mono'",fontSize:9,color:"#3a5060",letterSpacing:".1em",textTransform:"uppercase",marginBottom:2}}>Filtering</div>
              <div style={{fontFamily:"'DM Mono'",fontSize:13,color:"#e0eaf4"}}>{agencyFilter.replace("Department of","Dept. of")}</div>
            </div>
          )}
        </div>
      )}

      {/* CONTENT */}
      <main style={{padding:"12px 24px 60px",flex:1}}>
        {loading && (
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"120px 0",gap:14}}>
            <div className="spin" style={{width:16,height:16,border:"2px solid #0f1520",borderTopColor:"#c87020",borderRadius:"50%"}}/>
            <span style={{fontFamily:"'DM Mono'",fontSize:10,color:"#3a5060",letterSpacing:".1em"}}>FETCHING CONTRACTS…</span>
          </div>
        )}

        {error && (
          <div style={{textAlign:"center",padding:"60px 0",fontFamily:"'DM Mono'",fontSize:11,color:"#ff3057"}}>
            ERROR: {error}
          </div>
        )}

        {!loading && !error && visible.length===0 && (
          <div style={{fontFamily:"'DM Mono'",fontSize:10,color:"#2a3a48",padding:"40px 0",textAlign:"center"}}>
            NO CONTRACTS FOUND
          </div>
        )}

        <div style={{maxWidth:900}}>
          {!loading && visible.map((c,i)=><ContractCard key={i} c={c}/>)}
        </div>
      </main>

      <div style={{padding:"0 24px 20px",fontFamily:"'DM Mono'",fontSize:9,color:"#1a2a38",letterSpacing:".08em",textTransform:"uppercase"}}>
        Source: USASpending.gov · Contracts ≥$1M since Jan 2024 · Sorted by value · Data may lag 30–90 days
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
